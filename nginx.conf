# 1. 强制 HTTP 跳转 HTTPS
server {
    listen       80;
    server_name  joyousoda.top; # 替换为你的域名
    return 301 https://$host$request_uri;
}

# 2. HTTPS 主配置
server {
    listen       443 ssl;
    server_name  joyousoda.top; # 替换为你的域名

    # --- SSL 证书配置 ---
    # 请确保这两个文件已通过上面提到的方式上传到服务器相应路径
    ssl_certificate      /etc/nginx/cert/your_cert.pem;
    ssl_certificate_key  /etc/nginx/cert/your_cert.key;

    ssl_session_timeout  5m;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers  ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers  on;

    # --- 性能优化：Gzip ---
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
    gzip_vary on;

    # --- 核心：反向代理到 Docker 的 8080 端口 ---
    location / {
        # 注意：这里的 127.0.0.1 是宿主机的本地回环地址
        proxy_pass http://127.0.0.1:8080;

        # 传递真实的客户端信息给 Docker 容器内的应用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 如果你的前端是 SPA (React/Vue)，
        # 且 Docker 容器内的 Nginx 没有处理 try_files，
        # 则需要确保容器内的 Nginx 配置已经包含了 try_files 逻辑。
    }

    # 错误页面处理
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}